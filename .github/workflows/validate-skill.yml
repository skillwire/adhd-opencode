name: validate-skill

on:
  push:
    paths:
      - "skills/**"
      - "scripts/**"
      - "install/**"
      - "LICENSE"
      - "LICENSES/**"
      - "NOTICE"
      - "REUSE.toml"
      - "README.md"
      - "INSTALL.md"
      - ".github/workflows/validate-skill.yml"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure, frontmatter and cross-harness body
        run: python scripts/validate_skill.py
      - name: REUSE lint (license compliance)
        run: |
          pip install reuse
          reuse lint
